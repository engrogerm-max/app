<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>M1 Brasil - Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1 id="titulo">Carregando...</h1>
  <input type="text" id="inputTitulo" placeholder="Novo Título">
  <button onclick="salvar()">Salvar</button>

  <script>
    const supabase = window.supabase.createClient(
      'https://xwudkrpfbgvoymykyscv.supabase.co', 
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3dWRrcnBmYmd2b3lteWt5c2N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTMzMTYsImV4cCI6MjEwMjEyOTMxNn0.-mYSUSNe7nD7f6oJNHW-FT59Vy6P1ZErQ6xTqP_smjQ'
    );

    async function carregar() {
      const { data } = await supabase.from('m1br_site').select('titulo').eq('id', 1).single();
      if(data) document.getElementById('titulo').innerText = data.titulo;
    }

    async function salvar() {
      const novoTitulo = document.getElementById('inputTitulo').value;
      const { error } = await supabase.from('m1br_site').upsert({ id: 1, titulo: novoTitulo });
      if(error) alert("Erro: " + error.message);
      else { alert("Salvo!"); carregar(); }
    }

    carregar();
  </script>
</body>
</html>
